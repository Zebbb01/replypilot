# Releases land on main (Gitflow). Each one builds the image, pushes it to GitHub
# Container Registry, and, once the Azure variables are set, rolls it out to both
# containers of the Container App. Sign-in uses OpenID Connect: no stored secret.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/replypilot"
          echo "image=$repo:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  azure:
    needs: image
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new image
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g "$RG" -n "$APP" --container-name web --image "$IMAGE" --output none
          az containerapp update -g "$RG" -n "$APP" --container-name worker --image "$IMAGE" --output none
          echo "Deployed $IMAGE to https://$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)"
